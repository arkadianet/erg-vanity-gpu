# Workspace-level Cargo configuration
#
# OpenCL kernel compilation in erg-vanity-gpu can require a larger stack.
# This setting ensures tests pass without manual RUST_MIN_STACK exports.

[env]
RUST_MIN_STACK = "16777216"

# NVIDIA's in-process OpenCL compiler overflows the default 1MB Windows stack.
[target.x86_64-pc-windows-msvc]
rustflags = ["-C", "link-arg=/STACK:16777216"]

[target.x86_64-pc-windows-gnu]
rustflags = ["-C", "link-arg=-Wl,--stack,16777216"]
